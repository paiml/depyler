# Nightly binary builds — self-hosted fleet only, rolling dated prereleases.
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
# Skips build if no commits in the last 24 hours (the skip is written to the
# run summary, so a skipped night is not mistaken for a built one).
#
# Produces: depyler-{target}.tar.gz (+ .sha256) for
#   x86_64-unknown-linux-gnu   (intel clean-room, native)
#   aarch64-unknown-linux-gnu  (gx10 clean-room, rust:1.93.0-bullseye container)
#   aarch64-apple-darwin       (mini, native)
#   x86_64-apple-darwin        (mini, cross)
# x86_64-pc-windows-msvc is NotRun: the fleet has no Windows runner.
#
# Published as a prerelease under a NEW tag per night, `nightly-<YYYYMMDD>-<sha7>`.
# Never semver, never make_latest, never crates.io, and no tag is deleted.
# Hosted runners are banned fleet-wide (paiml/infra#231).

name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check for recent activity ────────────────────────────
  check-activity:
    runs-on: [self-hosted, Linux, X64, clean-room, intel]
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          RECENT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$RECENT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "Found $RECENT commit(s) in last 24h (or manual trigger)"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: no commits in last 24h, nothing built" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # ── Build depyler on the fleet ───────────────────────────
  build:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    name: depyler ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            kind: native
            smoke: true
            labels: '["self-hosted", "Linux", "X64", "clean-room", "intel"]'
          - target: aarch64-unknown-linux-gnu
            kind: container
            smoke: true
            labels: '["self-hosted", "Linux", "ARM64", "clean-room", "gx10", "docker"]'
          - target: aarch64-apple-darwin
            kind: native
            smoke: true
            labels: '["self-hosted", "macOS", "mini-builder"]'
          - target: x86_64-apple-darwin
            kind: native
            smoke: false
            labels: '["self-hosted", "macOS", "mini-builder"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # A sibling container through the mounted socket: every bind-mount path
      # must exist on the HOST, and the cache lives outside the workspace so a
      # checkout never wipes it.
      - name: Build (container, glibc 2.31 floor)
        if: matrix.kind == 'container'
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          T="${{ matrix.target }}"
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-depyler-nightly/$T"
          mkdir -p "$CACHE/registry" "$CACHE/target" "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e T="$T" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1; cargo build --release -p depyler --target "$T"'
          mkdir -p "target/$T/release"
          cp "$CACHE/target/$T/release/depyler" "target/$T/release/depyler"

      - name: Build (native)
        if: matrix.kind == 'native'
        run: |
          T="${{ matrix.target }}"
          rustup toolchain install 1.93.0 --profile minimal --target "$T"
          cargo +1.93.0 build --release -p depyler --target "$T"

      - name: Smoke
        if: matrix.smoke
        run: |
          "target/${{ matrix.target }}/release/depyler" --version

      - name: Package
        run: |
          ARCHIVE="depyler-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/depyler" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: depyler-${{ matrix.target }}
          path: |
            depyler-${{ matrix.target }}.tar.gz
            depyler-${{ matrix.target }}.tar.gz.sha256

  # ── Publish a new dated prerelease ───────────────────────
  release:
    needs: build
    runs-on: [self-hosted, Linux, X64, clean-room, intel]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the tag
        id: tag
        run: |
          TAG="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create nightly prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nightly ${{ steps.tag.outputs.tag }}
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Commit:** ${{ github.sha }}
            **Targets:** x86_64 linux-gnu (intel), aarch64 linux-gnu (glibc 2.31 floor), aarch64/x86_64 apple-darwin.
            **NotRun:** x86_64-pc-windows-msvc (no self-hosted Windows runner).

            > This is a prerelease. For stable releases, see the latest tagged version.
          files: |
            artifacts/*
